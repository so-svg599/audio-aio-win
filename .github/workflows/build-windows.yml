name: Build Windows

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Build onedir application
        run: pyinstaller --noconfirm AudioPlayerAIO.spec

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/AudioPlayerAIO/AudioPlayerAIO.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            Write-Error "Expected executable was not produced: $exe"
            exit 1
          }

      - name: Package Windows x64 distribution
        shell: pwsh
        run: Compress-Archive -Path "dist/AudioPlayerAIO/*" -DestinationPath "AudioPlayerAIO-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayerAIO-windows-x64
          path: AudioPlayerAIO-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AudioPlayerAIO-windows-x64.zip
